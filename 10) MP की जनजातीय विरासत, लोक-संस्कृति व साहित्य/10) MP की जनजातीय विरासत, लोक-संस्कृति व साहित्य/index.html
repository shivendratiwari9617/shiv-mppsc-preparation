<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <title>Unit MCQ Index</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 24px;
        }
        h1 {
            margin-bottom: 0.25rem;
        }
        .meta {
            color: #555;
            margin-bottom: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid #e0e0e0;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #1976d2;
            color: #fff;
            font-weight: 600;
        }
        tr:nth-child(even) td {
            background: #fafafa;
        }
        a {
            color: #1565c0;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            background: #e3f2fd;
            color: #0d47a1;
        }
    </style>
</head>
<body>
    <h1>Unit MCQ Index</h1>
    <div class="meta">
        Generated on: <strong>{generated_date}</strong><br/>
        Total Topics: <strong>{total_topics}</strong> |
        Total MCQs: <strong>{total_mcq}</strong>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Topic</th>
                <th>Coverage / Description</th>
                <th>MCQs</th>
            </tr>
        </thead>
        <tbody>
            {table_rows}
        </tbody>
    </table>
</body>
</html>
